{% with c=v.cover %}{% if c %}<div class="car photo">{% if badge|default:True %}<span class="tag badge">{{ v.get_category_display }}</span>{% endif %}<img src="{{ c.image.url }}" alt="{{ v.title }}" loading="lazy" width="640" height="480">{% if v.photos.all|length > 1 %}<span class="photo-count badge">{{ v.photos.all|length }} photos</span>{% endif %}</div>{% else %}{% include "_car.html" with badge=True %}{% endif %}{% endwith %}
